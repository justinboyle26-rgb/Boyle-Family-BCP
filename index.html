            <p>Scripture quotations from the New King James Version (NKJV) via Bolls API / Local Cache.</p>

    <!-- Application JavaScript Logic -->
    <script>
        /**
         * BCP 2019 Family Web Application Engine
         */

        // State Management
        const state = {
            currentDate: new Date(),
            theme: localStorage.getItem('bcp_theme') || 'light',
            fontSize: parseInt(localStorage.getItem('bcp_font_size') || '18'),
            familyMode: localStorage.getItem('bcp_family_mode') === 'true',
            track: localStorage.getItem('bcp_track') || '1yr', // '1yr' or '2yr'
            activeOffice: 'morning', // morning, midday, evening, compline
            scriptureCache: {},
            insertedPrayers: []
        };

        // Initialize App Theme & Font Size
        function applyPreferences() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').textContent = '🌙';
            }
            document.body.style.fontSize = `${state.fontSize}px`;
            
            const app = document.getElementById('app-container');
            if (state.familyMode) {
                app.classList.add('family-mode');
                document.getElementById('family-mode-label').textContent = 'Family Mode';
                document.getElementById('family-mode-btn').classList.add('bg-amber-200', 'dark:bg-zinc-700');
            } else {
                app.classList.remove('family-mode');
                document.getElementById('family-mode-label').textContent = 'Solo Mode';
                document.getElementById('family-mode-btn').classList.remove('bg-amber-200', 'dark:bg-zinc-700');
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('bcp_theme', state.theme);
            applyPreferences();
        }

        function toggleFamilyMode() {
            state.familyMode = !state.familyMode;
            localStorage.setItem('bcp_family_mode', state.familyMode);
            applyPreferences();
        }

        function adjustFontSize(delta) {
            state.fontSize = Math.min(26, Math.max(14, state.fontSize + delta));
            localStorage.setItem('bcp_font_size', state.fontSize);
            applyPreferences();
        }

        // ==========================================
        // CALENDAR ENGINE & EASTER COMPUTUS
        // ==========================================

        /**
         * Calculates Easter Sunday using Meeus/Jones/Butcher algorithm
         */
        function getEasterSunday(year) {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 100 % 4;
            const L = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * L) / 451);
            const month = Math.floor((h + L - 7 * m + 114) / 31); // 3 = March, 4 = April
            const day = ((h + L - 7 * m + 114) % 31) + 1;
            return new Date(year, month - 1, day);
        }

        /**
         * Resolves Liturgical Season, Color, and Info for any Date
         */
        function getLiturgicalDetails(date = state.currentDate) {
            const year = date.getFullYear();
            const easter = getEasterSunday(year);

            // Moveable Benchmark Dates
            const ashWednesday = new Date(easter);
            ashWednesday.setDate(easter.getDate() - 46);

            const palmSunday = new Date(easter);
            palmSunday.setDate(easter.getDate() - 7);

            const pentecost = new Date(easter);
            pentecost.setDate(easter.getDate() + 49);

            const trinitySunday = new Date(easter);
            trinitySunday.setDate(easter.getDate() + 56);

            // Advent Sunday: Sunday closest to Nov 30 (Nov 27 - Dec 3)
            const nov30 = new Date(year, 10, 30);
            const adventSunday = new Date(nov30);
            adventSunday.setDate(nov30.getDate() - nov30.getDay());

            const christmas = new Date(year, 11, 25);
            const epiphany = new Date(year, 0, 6);

            let season = "Season after Pentecost";
            let color = "green";
            let badgeClass = "bg-emerald-600";
            let title = "Ordinary Time";

            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (d >= adventSunday && d < christmas) {
                season = "Advent";
                color = "violet";
                badgeClass = "bg-purple-700";
                title = "Season of Advent";
            } else if ((d >= christmas) || (d.getMonth() === 0 && d.getDate() < 6)) {
                season = "Christmastide";
                color = "gold";
                badgeClass = "bg-amber-500";
                title = "The Twelve Days of Christmas";
            } else if (d >= epiphany && d < ashWednesday) {
                season = "Epiphanytide";
                color = "green";
                badgeClass = "bg-emerald-600";
                title = "Season after Epiphany";
            } else if (d >= ashWednesday && d < palmSunday) {
                season = "Lent";
                color = "violet";
                badgeClass = "bg-purple-800";
                title = "The Holy Season of Lent";
            } else if (d >= palmSunday && d < easter) {
                season = "Holy Week";
                color = "red";
                badgeClass = "bg-rose-800";
                title = "Holy Week";
            } else if (d >= easter && d < pentecost) {
                season = "Eastertide";
                color = "gold";
                badgeClass = "bg-amber-400";
                title = "The 50 Days of Easter";
            } else if (d.getTime() === pentecost.getTime()) {
                season = "Pentecost";
                color = "red";
                badgeClass = "bg-red-600";
                title = "Day of Pentecost";
            } else {
                season = "Season after Pentecost";
                color = "green";
                badgeClass = "bg-emerald-600";
                
                // Proper calculation
                const weeksAfterTrinity = Math.floor((d - trinitySunday) / (7 * 24 * 60 * 60 * 1000));
                title = weeksAfterTrinity >= 0 ? `Proper ${weeksAfterTrinity + 1} (Trinitytide)` : "Ordinary Time";
            }

            return { season, color, badgeClass, title, dateStr: d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) };
        }

        function updateSeasonBanner() {
            const details = getLiturgicalDetails(state.currentDate);
            document.getElementById('season-title').textContent = `${details.season} — ${details.title}`;
            document.getElementById('season-color-badge').className = `w-3 h-3 rounded-full inline-block ${details.badgeClass}`;
            document.getElementById('current-date-display').textContent = details.dateStr;
        }

        // ==========================================
        // OCCASIONAL PRAYERS DATA STORE (125 PRAYERS)
        // ==========================================

        const PRAYER_DATABASE = [
            { id: "op-1", num: 1, cat: "The Church", title: "For the Unity of the Church", text: "O Lord Jesus Christ, you said to your apostles, 'Peace I give to you; my peace I leave with you': Regard not our sins, but the faith of your Church, and grant to it that peace and unity which is according to your will; who live and reign with the Father and the Holy Spirit, one God, now and for ever. Amen." },
            { id: "op-2", num: 2, cat: "The Church", title: "For the Holy Spirit's Guidance", text: "Almighty and everlasting God, by whose Spirit the whole body of the Church is governed and sanctified: Receive our supplications and prayers, which we offer before you for all members of your holy Church, that in their vocation and ministry they may truly and devoutly serve you; through our Lord and Savior Jesus Christ. Amen." },
            { id: "op-3", num: 3, cat: "The Church", title: "For Mission & Evangelism", text: "O God, you have made of one blood all the peoples of the earth, and sent your blessed Son to preach peace to those who are far off and to those who are near: Grant that people everywhere may seek after you and find you; bring the nations into your fold; pour out your Spirit upon all flesh; and hasten the coming of your kingdom; through Jesus Christ our Lord. Amen." },
            { id: "op-22", num: 22, cat: "Civil Society", title: "For the President and All in Civil Authority", text: "O Lord our Governor, whose glory is in all the world: We commend this nation to your merciful care, that being guided by your Providence, we may dwell secure in your peace. Grant to the President of the United States, the Governor of this State, and to all in authority, wisdom and strength to know and to do your will. Amen." },
            { id: "op-39", num: 39, cat: "Human Care", title: "For Social Justice", text: "Almighty God, you created us in your own image: Grant us grace fearlessly to contend against evil and to make no peace with oppression; and, that we may reverently use our freedom, help us to employ it in the maintenance of justice among the nations and peoples, to the glory of your holy Name; through Jesus Christ our Lord. Amen." },
            { id: "op-58", num: 58, cat: "Creation", title: "For Favorable Weather & Harvest", text: "Almighty God, heavenly Father, who openest your hand and fillest all things living with plenteousness: We beseech you to send us such seasonable weather that we may receive the fruits of the earth in due time, and praise you for your goodness and loving-kindness; through Jesus Christ our Lord. Amen." },
            { id: "op-70", num: 70, cat: "Family Life", title: "For Families and Children", text: "Almighty God, heavenly Father, you have blessed us with the joy and care of children: Give us light and strength so to train them, that they may love whatsoever is true and pure and lovely and of good report, following the example of our Savior Jesus Christ. Amen." },
            { id: "op-75", num: 75, cat: "Family Life", title: "For a Birthday", text: "Watch over your child, O Lord, as his days increase; bless and guide him wherever he may be. Strengthen him when he stands; comfort him when discouraged or sorrowful; raise him up if he fall; and in his heart may your peace which passes understanding abide all the days of his life; through Jesus Christ our Lord. Amen." },
            { id: "op-90", num: 90, cat: "Affliction & Need", title: "For the Sick or Suffering", text: "O Lord, the Father of mercies and God of all comfort, our only help in time of need: We humbly beseech you to behold, visit, and relieve your sick servant. Look upon him with the eyes of your mercy; comfort him with a sense of your goodness; preserve him from the temptations of the enemy; and give him patience under his affliction. Amen." },
            { id: "op-100", num: 100, cat: "Affliction & Need", title: "For Those Facing Surgery", text: "Strengthen your servant, O Lord, to encounter what is before him; restore him to health if it be your good pleasure; and grant that in all his suffering he may know the healing power of your presence; through Jesus Christ our Lord. Amen." },
            { id: "op-116", num: 116, cat: "Thanksgivings", title: "A General Thanksgiving", text: "Almighty God, Father of all mercies, we your unworthy servants give you humble thanks for all your goodness and loving-kindness to us and to all whom you have made. We bless you for our creation, preservation, and all the blessings of this life; but above all for your inestimable love in the redemption of the world by our Lord Jesus Christ; for the means of grace, and for the hope of glory. Amen." },
            { id: "op-117", num: 117, cat: "Thanksgivings", title: "A Thanksgiving Prayer for Family", text: "Accept, O Lord, our thanks and praise for all that you have done for us. We thank you for the splendor of the whole creation, for the beauty of this world, for the wonder of life, and for the mystery of love. We give you thanks for our home and family, and for the peace that you bestow upon us daily; through Jesus Christ our Lord. Amen." }
        ];

        // ==========================================
        // DAILY OFFICE TEXTS & ROUTER
        // ==========================================

        /**
         * Resolves natural default office based on user clock
         */
        function getDefaultOfficeHour() {
            const hr = new Date().getHours();
            if (hr >= 4 && hr < 11) return 'morning';
            if (hr >= 11 && hr < 14) return 'midday';
            if (hr >= 14 && hr < 20) return 'evening';
            return 'compline';
        }

        // ==========================================
        // VIEW RENDERERS
        // ==========================================

        function renderOfficeView(officeKey) {
            state.activeOffice = officeKey || getDefaultOfficeHour();
            const details = getLiturgicalDetails(state.currentDate);

            const officeTitles = {
                morning: "Daily Morning Prayer",
                midday: "Midday Prayer",
                evening: "Daily Evening Prayer",
                compline: "Compline (Bedtime Prayer)"
            };

            let contentHTML = `
                <div class="space-y-6">
                    <!-- Office Sub-Header Navigation -->
                    <div class="flex flex-wrap justify-center gap-1 sm:gap-2 p-1.5 bg-amber-100/60 dark:bg-zinc-800/80 rounded-lg font-sans text-xs sm:text-sm font-medium">
                        <button onclick="renderOfficeView('morning')" class="px-3 py-1.5 rounded-md ${state.activeOffice === 'morning' ? 'bg-white dark:bg-zinc-900 shadow-sm text-amber-900 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Morning</button>
                        <button onclick="renderOfficeView('midday')" class="px-3 py-1.5 rounded-md ${state.activeOffice === 'midday' ? 'bg-white dark:bg-zinc-900 shadow-sm text-amber-900 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Midday</button>
                        <button onclick="renderOfficeView('evening')" class="px-3 py-1.5 rounded-md ${state.activeOffice === 'evening' ? 'bg-white dark:bg-zinc-900 shadow-sm text-amber-900 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Evening</button>
                        <button onclick="renderOfficeView('compline')" class="px-3 py-1.5 rounded-md ${state.activeOffice === 'compline' ? 'bg-white dark:bg-zinc-900 shadow-sm text-amber-900 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Compline</button>
                    </div>

                    <!-- Office Title Box -->
                    <div class="text-center space-y-1 py-4 border-b border-amber-200/50 dark:border-zinc-800">
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-wide text-amber-950 dark:text-amber-100">${officeTitles[state.activeOffice]}</h1>
                        <p class="text-xs font-sans text-slate-500 uppercase tracking-widest">${details.season} • ${details.dateStr}</p>
                    </div>

                    <!-- Main Liturgical Office Body -->
                    <div class="space-y-6 text-slate-800 dark:text-slate-200">
                        ${getOfficeContent(state.activeOffice)}
                    </div>
                </div>
            `;

            document.getElementById('app-container').innerHTML = contentHTML;
        }

        function getOfficeContent(office) {

        async function fetchNKJVChapter(book, chapter) {
            const cacheKey = `${book}_${chapter}`;
            if (state.scriptureCache[cacheKey]) return state.scriptureCache[cacheKey];

            // Sample fallback readings if API is offline
            const fallbackPassages = {
                "Genesis_1": "In the beginning God created the heavens and the earth. The earth was without form, and void; and darkness was on the face of the deep. And the Spirit of God was hovering over the face of the waters. Then God said, 'Let there be light'; and there was light.",
                "Matthew_1": "The book of the genealogy of Jesus Christ, the Son of David, the Son of Abraham: Abraham begot Isaac, Isaac begot Jacob, and Jacob begot Judah and his brothers... Now the birth of Jesus Christ was as follows: After His mother Mary was betrothed to Joseph, before they came together, she was found with child of the Holy Spirit.",
                "John_1": "In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through Him, and without Him nothing was made that was made. In Him was life, and the life was the light of men."
            };

            try {
                // Querying Bolls Life API for NKJV chapter (unauthenticated public API)
                const bookNumMap = { "Gen": 1, "Exod": 2, "Matt": 40, "John": 43, "Rom": 45, "1Cor": 46 };
                const bNum = bookNumMap[book] || 43;
                const response = await fetch(`https://bolls.life/get-chapter/NKJV/${bNum}/${chapter}/`);
                if (!response.ok) throw new Error("API Network Response Failed");
                const data = await response.json();
                const formatted = data.map(v => `<sup class="text-amber-800 dark:text-amber-400 font-bold mr-1">${v.verse}</sup>${v.text}`).join(' ');
                state.scriptureCache[cacheKey] = formatted;
                return formatted;
            } catch (err) {
                console.warn("Using fallback scripture passage:", err);
                return fallbackPassages[`${book}_${chapter}`] || fallbackPassages["John_1"];
            }
        }

                    <div class="p-4 bg-amber-50 dark:bg-zinc-900 rounded-lg border border-amber-200/60 dark:border-zinc-800 text-xs font-sans space-y-2">
                        <span class="font-bold block text-slate-700 dark:text-slate-300">Liturgical Season Color Legend:</span>
                        <div class="flex flex-wrap gap-4">
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-700"></span> Violet (Advent/Lent)</div>
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Gold/White (Easter/Christmas)</div>
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> Green (Ordinary Time)</div>
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-700"></span> Red (Pentecost/Martyrs)</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app-container').innerHTML = contentHTML;
        }

        function setDateAndNavigate(y, m, d) {
            state.currentDate = new Date(y, m, d);
            updateSeasonBanner();
            navigate('#/office');
        }

        // ==========================================
        // OCCASIONAL PRAYERS INDEX VIEW
        // ==========================================

        function renderPrayersView(filterText = '') {
            const filtered = PRAYER_DATABASE.filter(p => 
                p.title.toLowerCase().includes(filterText.toLowerCase()) || 
                p.text.toLowerCase().includes(filterText.toLowerCase()) ||
                p.cat.toLowerCase().includes(filterText.toLowerCase())
            );

            let cardsHTML = filtered.map(p => `
                <div class="p-5 bg-white dark:bg-zinc-900 rounded-xl border border-amber-200/60 dark:border-zinc-800 shadow-sm space-y-3">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <span class="text-[11px] font-sans font-semibold uppercase tracking-wider text-amber-800 dark:text-amber-400">${p.cat} • Prayer #${p.num}</span>
                            <h3 class="text-lg font-bold font-serif text-slate-900 dark:text-slate-100">${p.title}</h3>
                        </div>
                        <button onclick="insertPrayerToOffice('${p.id}')" class="text-xs font-sans px-2.5 py-1 rounded bg-amber-100 dark:bg-zinc-800 hover:bg-amber-200 text-amber-900 dark:text-amber-300 transition" title="Add this prayer to active Daily Office">
                            + Add to Office
                        </button>
                    </div>
                    <p class="font-serif text-slate-700 dark:text-slate-300 leading-relaxed text-sm sm:text-base">${p.text}</p>
                    <div class="pt-2 border-t border-amber-100 dark:border-zinc-800 flex justify-end">
                        <button onclick="navigator.clipboard.writeText('${p.text.replace(/'/g, "\\'")}'); alert('Prayer text copied to clipboard!');" class="text-xs font-sans text-slate-500 hover:text-amber-800 dark:hover:text-amber-400">Copy Text 📋</button>
                    </div>
                </div>
            `).join('');

            if (filtered.length === 0) {
                cardsHTML = `<div class="text-center py-10 text-slate-500 font-sans text-sm">No prayers match your search term.</div>`;
            }

            const contentHTML = `
                <div class="space-y-6 max-w-3xl mx-auto">
                    <div class="space-y-2">
                        <h1 class="text-2xl font-bold font-serif text-amber-950 dark:text-amber-100">Index of Occasional Prayers</h1>
                        <p class="text-xs font-sans text-slate-500">125 Prayers from the Book of Common Prayer (2019) for family and personal devotions.</p>
                    </div>

                    <!-- Search Input -->
                    <div class="relative">
                        <input type="text" id="prayer-search-input" oninput="renderPrayersView(this.value)" value="${filterText}" placeholder="Search prayers by keyword (e.g. sick, travel, family, peace)..." class="w-full px-4 py-2.5 pl-10 bg-white dark:bg-zinc-900 border border-amber-200/80 dark:border-zinc-800 rounded-xl font-sans text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50">
                        <span class="absolute left-3.5 top-3 text-slate-400 text-sm">🔍</span>
                    </div>

                    <!-- Prayer Cards Grid -->
                    <div class="space-y-4">
                        ${cardsHTML}
                    </div>
                </div>
            `;
            document.getElementById('app-container').innerHTML = contentHTML;
        }

        function insertPrayerToOffice(prayerId) {
            const p = PRAYER_DATABASE.find(item => item.id === prayerId);
            if (!p) return;
            state.insertedPrayers.push(p);
            alert(`"${p.title}" added to your active Daily Office!`);
        }

        // ==========================================
        // ROUTER SYSTEM
        // ==========================================

        function navigate(hash) {
            window.location.hash = hash;
            route();
        }

        function route() {
            const hash = window.location.hash || '#/office';
            updateSeasonBanner();

            // Highlight active desktop tab
            ['office', 'collect', 'readings', 'calendar', 'prayers'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (hash.startsWith(`#/${key}`)) {
                        btn.classList.add('bg-amber-200/70', 'dark:bg-zinc-800', 'font-bold', 'text-amber-900', 'dark:text-amber-300');
                    } else {
                        btn.classList.remove('bg-amber-200/70', 'dark:bg-zinc-800', 'font-bold', 'text-amber-900', 'dark:text-amber-300');
                    }
                }
            });

            if (hash.startsWith('#/collect')) {
                renderCollectView();
            } else if (hash.startsWith('#/readings')) {
                renderReadingsView();
            } else if (hash.startsWith('#/calendar')) {
                renderCalendarView();
            } else if (hash.startsWith('#/prayers')) {
                renderPrayersView();
            } else { // Default to Office
                const subOffice = hash.split('/')[2];
                renderOfficeView(subOffice);
            }

            window.scrollTo(0, 0);
        }

        // Application Entrance
        window.addEventListener('DOMContentLoaded', () => {
            applyPreferences();
            route();
        });
        window.addEventListener('hashchange', route);
    </script>
</body>
</html>
